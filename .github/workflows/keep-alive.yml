# Reserva do keep-alive (ADR-005): o cron da Vercel é o principal.
# Faz um ping diário em /api/health, que consulta o banco e impede o Supabase Free de pausar.
name: keep-alive

on:
  schedule:
    - cron: "30 15 * * *"   # 12:30 de Brasília, depois do cron da Vercel
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            body=$(curl -fsS --max-time 30 https://nossa-wishlist.vercel.app/api/health) && echo "$body" && exit 0
            echo "tentativa $i falhou"; sleep 20
          done
          exit 1
